[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mediflow-ai-service"
version = "1.0.0"
description = "MediFlow AI — Agentic Multimodal Hospital Intelligence Hub"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.1",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9"
]
