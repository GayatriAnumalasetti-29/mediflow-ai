version: '3.9'

services:
  # ─────────────────────────────────────────────
  # 🤖 Python FastAPI AI Microservice
  # ─────────────────────────────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: mediflow_ai_service
    restart: unless-stopped
    env_file:
      - ./ai-service/.env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - mediflow_net

  # ─────────────────────────────────────────────
  # ⚙️ Node.js Express Backend Gateway
  # ─────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: mediflow_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - AI_SERVICE_URL=http://ai-service:8000
      - NODE_ENV=production
    ports:
      - "5000:5000"
    depends_on:
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - mediflow_net

  # ─────────────────────────────────────────────
  # 🖥️ React + Vite Frontend
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    container_name: mediflow_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - mediflow_net

networks:
  mediflow_net:
    driver: bridge
